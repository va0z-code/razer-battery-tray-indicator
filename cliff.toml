[remote.github]
owner = "va0z-code"
repo = "razer-battery-tray"

[changelog]
header = "## Changelog\n"
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- set grouped = commits | group_by(attribute="group") -%}

{%- set groups = ["New features", "Bug fixes", "Performance", "Refactoring", "Documentation", "Build process updates", "Testing", "Other work"] %}
{%- for group in groups %}
{%- if grouped[group] %}
### {{ group }}
{% for commit in grouped[group] %}
-   [{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}): \
  {{ commit.raw_message | default(value=commit.message) | split(pat="\n") | first }}\
  {%- if commit.remote and commit.remote.pr_number %} \
    ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}))\
  {%- endif %}\
  {%- if commit.remote and commit.remote.username %} \
    ([@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}))\
  {%- endif %}
{% endfor %}
{% endif -%}
{%- endfor %}

{% if version and previous and previous.version %}
**Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/va0z-code/razer-battery-tray" },
]

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
commit_parsers = [
  { message = "^feat", group = "New features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^doc", group = "Documentation" },
  { message = "^build|^ci", group = "Build process updates" },
  { message = "^chore: bump version", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore", group = "Other work" },
  { message = "^test", group = "Testing" },
  { message = ".*", group = "Other work" },
]
