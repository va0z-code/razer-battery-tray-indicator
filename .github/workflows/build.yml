name: Build

on:
  workflow_call:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build & Verify
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build installer
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $exe = Resolve-Path target/x86_64-pc-windows-msvc/release/snake-charger.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" "/DExePath=$exe" installer/snake-charger.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $exe dist/SnakeCharger-portable.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: snake-charger
          path: |
            dist/SnakeCharger-Setup.exe
            dist/SnakeCharger-portable.exe
          if-no-files-found: error
