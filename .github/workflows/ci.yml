name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "cliff.toml"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "cliff.toml"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Verify
    uses: ./.github/workflows/build.yml
