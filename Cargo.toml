[package]
name = "snake-charger"
version = "1.0.0"
authors = ["va0z-code", "xzeldon <contact@zeldon.ru>"]
edition = "2021"
description = "Razer mouse battery level in the Windows tray with low battery notifications. No Synapse required."
repository = "https://github.com/va0z-code/razer-battery-tray"
license = "MIT"
keywords = ["razer", "battery", "tray", "windows", "synapse"]

# Slower builds, faster executables
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Faster builds, slower executables
[profile.dev]
opt-level = 0
lto = false
incremental = true
codegen-units = 16

[dependencies]
# Communicate with HID devices
hidapi = "2.6.4"

# Logging
log = "0.4.29"
pretty_env_logger = "0.5.0"

# Event Loop and Tray Icon
tao = "0.35.3"
tray-icon = "0.24.1"

# Image manipulation
image = "0.25.9"

# Windows API
winapi = { version = "0.3.9", features = ["winuser", "wincon", "consoleapi", "shellapi", "winreg", "winerror", "minwindef", "sysinfoapi"] }

# Efficient synchronization primitives (e.g. Mutex, RwLock and etc.)
parking_lot = "0.12"

# Desktop notifications
notify-rust = "4.11.7"

[build-dependencies]
# Embed the app icon and version info into the .exe
winresource = "0.1.31"
